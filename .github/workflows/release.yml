name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@main
    with:
      publish: true
    permissions:
      contents: write
      id-token: write

  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/furifont
          key: source-han-jp-vf
      # The tag's commit time stamps the fonts, so the same tag builds the same bytes.
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm fonts
      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: dist/fonts

  attach:
    needs: [release, fonts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fonts
          path: fonts
      # Everything in one archive, for the site's "Download all" button.
      - run: cd fonts && zip --quiet ../Furifont.zip *
      - run: gh release upload "$GITHUB_REF_NAME" fonts/* Furifont.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      # The site's build downloads these fonts: Vercel's build of the release commit ran before they were here.
      - run: curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
