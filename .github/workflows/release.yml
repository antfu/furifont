name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@main
    with:
      publish: true
    permissions:
      contents: write
      id-token: write

  fonts:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/furifont
          key: source-han-jp-vf
      # The tag's commit time stamps the fonts, so the same tag builds the same bytes.
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm fonts
      # Everything in one archive, for the site's "Download all" button.
      - run: cd dist/fonts && zip --quiet ../Furifont.zip *
      - run: gh release upload "$GITHUB_REF_NAME" dist/fonts/* dist/Furifont.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      # Vercel skips the release commit, as its fonts are not attached yet: this commit deploys them.
      - run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --allow-empty --message "chore: deploy $GITHUB_REF_NAME"
          git push origin HEAD:main
