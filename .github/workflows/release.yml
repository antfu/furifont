name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@main
    with:
      publish: true
    permissions:
      contents: write
      id-token: write

  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/furifont
          key: source-han-jp-vf
      # The tag's commit time stamps the fonts, so the same tag builds the same bytes.
      - run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) pnpm fonts
      - uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: dist/fonts
