  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - storybook@10.6.3
  - turbo@2.11.10

trustPolicy: no-downgrade
# Releases older than 180 days may predate provenance (Nuxt's toolchain still needs semver 6).
trustPolicyIgnoreAfter: 259200
# pnpm flags these as downgrades although each one's SLSA provenance names the same
# repository and publish workflow as its previous release (checked one by one).
trustPolicyExclude:
  - stylehacks@9.0.8
  - postcss-unique-selectors@9.0.6
  - postcss-svgo@9.0.6
  - postcss-reduce-transforms@9.0.6
  - postcss-reduce-initial@9.0.7
  - postcss-ordered-values@9.0.9
  - postcss-normalize-whitespace@9.0.8
  - postcss-normalize-url@9.0.7
  - postcss-normalize-unicode@9.1.1
  - postcss-normalize-timing-functions@9.0.7
  - postcss-normalize-string@9.0.7
  - postcss-normalize-repeat-style@9.0.7
  - postcss-normalize-positions@9.0.8
  - postcss-normalize-display-values@9.0.7
  - postcss-normalize-charset@9.0.6
  - postcss-minify-selectors@9.0.8
  - postcss-minify-params@9.0.8
  - postcss-minify-gradients@9.0.8
  - postcss-minify-font-values@9.0.9
  - postcss-merge-rules@9.1.4
  - postcss-merge-longhand@9.4.0
  - postcss-discard-overridden@9.0.6
  - postcss-discard-empty@9.0.8
  - postcss-discard-duplicates@9.0.7
  - postcss-discard-comments@9.0.8
  - postcss-convert-values@9.0.9
  - postcss-colormin@9.0.8
  - cssnano-utils@9.0.0
  - cssnano-preset-default@9.6.0
  - cssnano@9.6.0

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - packages/*

overrides:
  # One jiti for ESLint and Nuxt, so both resolve the same Vite instance (and types).
  jiti: ^2.7.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.0
    skills: ^1.7.4
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@x18n/cli': ^0.0.6
    bumpp: ^12.3.0
    eslint: ^10.13.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.42.1
    nano-staged: ^1.0.2
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    tsdown: ^0.23.1
    turbo: ^2.11.10
    typescript: ^6.0.3
    vite: ^8.3.4
  frontend:
    '@comark/nuxt': ^0.7.0
    '@devframes/vite': ^1.2.6
    '@iconify-json/ph': ^1.2.2
    '@nuxt/kit': ^4.6.2
    '@unocss/nuxt': ^66.11.0
    nuxt: ^4.6.2
    unocss: ^66.11.0
    vue: ^3.5.44
    vue-i18n: ^11.4.16
    vue-tsc: ^3.3.13
  inlined:
    '@antfu/utils': ^9.3.0
  prod:
    '@upstash/redis': ^1.39.0
    brotli-wasm: ^3.0.1
    cac: ^7.1.0
    devframe: ^1.2.6
    harfbuzzjs: ^1.6.3
    valibot: ^1.5.0
  storybook:
    '@storybook-vue/nuxt': ^10.0.3
    storybook: ^10.6.3
  testing:
    '@playwright/test': 1.63.0
    vitest: ^5.0.5
  types:
    '@types/node': ^26.6.5
